<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b101b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Finansım"><meta name="description" content="Ücretsiz, çevrimdışı kişisel bütçe ve varlık takibi."><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="./icon-192.png"><title>Finansım • Kişisel Finans</title><style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eff5ff;background:#0a101a;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 80% -10%,#183b3a 0,transparent 35%),#0a101a}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}a{color:#72dfb8}.shell{max-width:1320px;margin:auto;display:grid;grid-template-columns:238px minmax(0,1fr);min-height:100vh}.sidebar{border-right:1px solid #22303e;padding:30px 17px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:12px;padding:4px 12px 38px;font-size:23px;font-weight:800;letter-spacing:-.8px}.logo{background:linear-gradient(135deg,#48d4ac,#96f4bf);color:#102c27;border-radius:13px;display:grid;place-items:center;width:39px;height:39px;font-size:20px}.nav{width:100%;display:flex;align-items:center;gap:12px;color:#a5b6c9;background:transparent;border:0;padding:13px;border-radius:12px;text-align:left;font-weight:600;margin-bottom:5px}.nav.active,.nav:hover{background:#1b3036;color:#8becc1}.nav svg{width:19px;height:19px}.side-bottom{margin-top:auto;padding:12px;color:#72889a;font-size:12px;line-height:1.7}.content{padding:30px 36px 90px;min-width:0}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:30px}.eyebrow{font-size:11px;letter-spacing:2px;color:#63cfab;font-weight:800;text-transform:uppercase}.heading{margin:7px 0 0;font-size:32px;letter-spacing:-1px}.muted{color:#92a6b9}.top-actions{display:flex;gap:10px;align-items:center}.btn{border-radius:12px;padding:12px 17px;border:1px solid #34485a;background:#1b2a3a;color:#e6f2fb;font-weight:700}.btn:hover{filter:brightness(1.1)}.btn.primary{background:#7ce6b4;color:#08251d;border-color:#7ce6b4}.btn.danger{color:#ffb4b4;border-color:#683c46;background:#321d2a}.btn.small{padding:8px 11px;font-size:12px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{border-radius:20px;background:linear-gradient(145deg,#172332,#121e2b);border:1px solid #2a3b4d;padding:21px;min-width:0;box-shadow:0 10px 25px #0001}.card .caption{color:#9bacbf;font-size:13px}.value{font-size:27px;font-weight:780;letter-spacing:-.9px;margin-top:13px;overflow-wrap:anywhere}.value.green{color:#8fe9bc}.value.orange{color:#ffc48a}.value.red{color:#f7a4aa}.hero{background:linear-gradient(115deg,#174639,#142c32 56%,#152336);border-color:#326b58;grid-column:span 2}.hero .value{font-size:40px}.sub{color:#9fbdba;font-size:12px;margin-top:9px}.section-header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:28px 0 14px}.section-header h2{font-size:18px;margin:0;letter-spacing:-.2px}.panels{display:grid;grid-template-columns:1.2fr .8fr;gap:15px}.progress{height:9px;background:#304451;border-radius:99px;overflow:hidden;margin:15px 0 8px}.progress>div{height:100%;background:linear-gradient(90deg,#42c89f,#b1f6cb);border-radius:inherit;transition:width .3s}.row{display:flex;align-items:center;justify-content:space-between;gap:15px}.mini{font-size:12px;color:#92a9ba}.budget-line{padding:13px 0;border-bottom:1px solid #2b3b4a}.budget-line:last-child{border:0}.list{display:flex;flex-direction:column}.transaction{display:flex;align-items:center;gap:13px;padding:14px 0;border-bottom:1px solid #273645}.transaction:last-child{border:0}.badge-icon{width:42px;height:42px;display:grid;place-items:center;background:#26384a;border-radius:13px;font-size:19px;flex-shrink:0}.transaction .desc{flex:1;min-width:0}.transaction strong{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.transaction small{color:#8da3b7;font-size:12px}.amount{font-weight:750;white-space:nowrap}.amount.income{color:#8ce8b8}.amount.expense{color:#f3a8a8}.amount.transfer{color:#b5c7ec}.delete{border:0;background:transparent;color:#7d91a4;padding:6px}.delete:hover{color:#ff9292}.empty{text-align:center;color:#93a9bb;padding:32px 12px;line-height:1.8}.monthbar{display:flex;align-items:center;gap:8px}.monthbar button{background:#1b2a39;border:1px solid #35495b;color:#d6e6f4;border-radius:10px;padding:8px 11px}.monthbar b{min-width:110px;text-align:center}.hidden{display:none!important}.modal-wrap{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:18px;z-index:20}.modal{width:100%;max-width:490px;background:#172433;border:1px solid #3b5265;border-radius:22px;padding:26px;max-height:90vh;overflow:auto;box-shadow:0 20px 100px #0008}.modal h2{margin:0 0 20px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:7px;color:#aabdd0;font-size:13px;margin-bottom:14px}.field.full{grid-column:span 2}input,select{background:#0e1926;color:#f0f7ff;padding:12px;border-radius:10px;border:1px solid #3b4e60;width:100%;outline:none;min-width:0}input:focus,select:focus{border-color:#72dfb8}input[type=file]{padding:9px}.modal-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}.tag{display:inline-block;background:#224a40;color:#8ae5bb;padding:6px 9px;font-size:11px;border-radius:99px;font-weight:800}.notice{border:1px solid #3a554f;background:#18312f;border-radius:12px;padding:13px;color:#b5d9d1;font-size:12px;line-height:1.6}.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.settings-list{max-width:680px}.settings-list .card{margin-bottom:15px}.settings-list h3{margin:0 0 12px}.form-hint{font-size:12px;color:#91a5b9;line-height:1.5}.legend{display:flex;flex-wrap:wrap;gap:15px;margin-top:16px}.legend span{display:flex;align-items:center;gap:7px;color:#a5b8cb;font-size:12px}.dot{width:10px;height:10px;border-radius:50%}.bar-chart{display:flex;gap:9px;align-items:end;height:170px;padding-top:20px;border-bottom:1px solid #344454}.bar-group{flex:1;display:flex;justify-content:center;gap:4px;align-items:end;height:100%}.bar{border-radius:5px 5px 0 0;min-width:14px;max-width:34px;flex:1}.chart-labels{display:flex;justify-content:space-between;gap:9px;margin-top:8px}.chart-labels span{flex:1;text-align:center;font-size:11px;color:#8da4b6}.quick{display:flex;gap:8px;flex-wrap:wrap}.footer-nav{display:none}.warning{color:#ffbf91}.pill{border:1px solid #355264;border-radius:99px;padding:6px 10px;font-size:11px;color:#b4c8d7}.card p{line-height:1.65}.toast{position:fixed;bottom:22px;right:22px;background:#274b43;color:#defbef;border:1px solid #52816b;padding:13px 18px;border-radius:12px;z-index:50;box-shadow:0 10px 30px #0007}.detail-title{font-size:19px;margin:0 0 10px}.hamburger{display:none}

</style></head><body><div class="shell"><aside class="sidebar"><div class="brand"><div class="logo">₺</div> Finansım</div><nav id="navDesktop"></nav><div class="side-bottom">🔒 Verilerin bu cihazda saklanır.<br>Ücretsiz • Reklamsız • Hesapsız</div></aside><main class="content"><header class="topbar"><div><div class="eyebrow">Kişisel Finans Merkezi</div><h1 class="heading" id="pageTitle">Genel Bakış</h1></div><div class="top-actions"><button class="btn" id="backupHeader">↧ Yedek al</button><button class="btn primary" id="addHeader">＋ İşlem ekle</button></div></header><div id="view"></div></main></div><div class="footer-nav" id="navMobile"></div><div id="modalRoot"></div><script>
(()=>{'use strict';
const KEY='finansim-v1';const today=()=>new Date().toLocaleDateString('en-CA');const monthNow=()=>today().slice(0,7);const fmt=n=>new Intl.NumberFormat('tr-TR',{maximumFractionDigits:2}).format(n||0)+' TL';const usd=n=>new Intl.NumberFormat('tr-TR',{maximumFractionDigits:2}).format(n||0)+' USD';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number.isFinite(+n)?+n:0;const id=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);const defaultState=()=>({version:1,created:today(),settings:{income1:10000,income2:32000,phone:800,living:12000,emergency:3000,bankOpening:10000,usdOpening:250,debtOpening:10000,fx:0},transactions:[]});let state;try{state=JSON.parse(localStorage.getItem(KEY))||defaultState();if(!state.settings||!Array.isArray(state.transactions))throw Error('format')}catch(e){state=defaultState();}let page='dashboard',selectedMonth=monthNow(),filter='all';const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){alert('Kayıt başarısız. Cihaz depolama alanını kontrol et ve yedek al.');return false}};const months=()=>new Date(selectedMonth+'-01T12:00:00');const monthLabel=k=>new Date(k+'-01T12:00:00').toLocaleDateString('tr-TR',{month:'long',year:'numeric'});const monthMove=n=>{const d=months();d.setMonth(d.getMonth()+n);selectedMonth=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');render()};const cats={living:{name:'Yaşam gideri',emoji:'🛒'},emergency:{name:'Beklenmedik gider',emoji:'🧰'},phone:{name:'Telefon / sabit',emoji:'📱'},income:{name:'Gelir',emoji:'💸'},debt:{name:'Kredi kartı ödemesi',emoji:'💳'},usdBuy:{name:'USD yatırım alımı',emoji:'💵'},usdSell:{name:'USD yatırım satışı',emoji:'💱'}};const calc=()=>{let bank=money(state.settings.bankOpening),debt=money(state.settings.debtOpening),dollars=money(state.settings.usdOpening);const scoped=state.transactions.filter(x=>x.date.startsWith(selectedMonth));const sum=k=>scoped.filter(x=>x.kind===k).reduce((s,x)=>s+money(x.amount),0);for(const x of state.transactions){const a=money(x.amount);if(x.kind==='income')bank+=a;if(['living','emergency','phone','debt','usdBuy'].includes(x.kind))bank-=a;if(x.kind==='debt')debt=Math.max(0,debt-a);if(x.kind==='usdBuy')dollars+=money(x.usdAmount);if(x.kind==='usdSell'){bank+=a;dollars-=money(x.usdAmount)}}return {bank,debt,dollars,spending:sum('living'),emergency:sum('emergency'),phone:sum('phone'),income:sum('income'),debtPaid:sum('debt'),monthTransactions:scoped,investmentValue:state.settings.fx>0?dollars*state.settings.fx:null}};
const navs=[['dashboard','▦','Genel Bakış'],['transactions','≡','İşlemler'],['budgets','◫','Bütçem'],['assets','◈','Varlıklar'],['settings','⚙','Ayarlar']];const nav=()=>navs.map(([k,ico,title])=>`<button class="nav ${page===k?'active':''}" data-page="${k}"><span style="font-size:20px;width:22px;text-align:center">${ico}</span>${title}</button>`).join('');const navM=()=>navs.map(([k,ico,title])=>`<button class="${page===k?'active':''}" data-page="${k}"><span style="font-size:20px">${ico}</span>${title}</button>`).join('');const monthBar=()=>`<div class="monthbar"><button data-month="-1" aria-label="Önceki ay">‹</button><b>${monthLabel(selectedMonth)}</b><button data-month="1" aria-label="Sonraki ay">›</button></div>`;const progress=(used,limit)=>`<div class="progress"><div style="width:${limit?Math.min(100,Math.max(0,used/limit*100)):0}%"></div></div>`;const budget=(title,used,limit)=>`<div class="budget-line"><div class="row"><b>${title}</b><span class="mini">${fmt(used)} / ${fmt(limit)}</span></div>${progress(used,limit)}<div class="row"><span class="mini">${limit?Math.round(used/limit*100):0}% kullanıldı</span><span class="mini ${used>limit?'warning':''}">${used>limit?'Limit aşıldı: '+fmt(used-limit):'Kalan: '+fmt(limit-used)}</span></div></div>`;
const transactions=items=>items.length?`<div class="list">${items.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.created.localeCompare(a.created)).map(x=>`<div class="transaction"><div class="badge-icon">${cats[x.kind]?.emoji||'•'}</div><div class="desc"><strong>${esc(x.note||cats[x.kind]?.name)}</strong><small>${esc(new Date(x.date+'T12:00:00').toLocaleDateString('tr-TR',{day:'numeric',month:'short'}))} · ${cats[x.kind]?.name||x.kind}${x.usdAmount?' · '+usd(x.usdAmount):''}</small></div><div class="amount ${x.kind==='income'?'income':x.kind==='debt'||x.kind.startsWith('usd')?'transfer':'expense'}">${x.kind==='income'||x.kind==='usdSell'?'+':'−'}${fmt(x.amount)}</div><button class="delete" aria-label="İşlemi sil" title="İşlemi sil" data-delete="${esc(x.id)}">✕</button></div>`).join('')}</div>`:'<div class="empty">Henüz kayıt yok.<br>İlk işlemini ekleyerek başla.</div>';
function dashboard(c){const s=state.settings,total=s.income1+s.income2,limit=s.living+s.emergency+s.phone,remaining=total-limit;return `<div class="cards"><div class="card hero"><div class="caption">Aylık birikim potansiyeli</div><div class="value green">${fmt(remaining)}</div><div class="sub">Planlanan gelirden bütçe limitleri çıkarıldı · %${Math.round(remaining/total*100)||0}</div></div><div class="card"><div class="caption">Banka / TL nakit</div><div class="value">${fmt(c.bank)}</div><div class="sub">Kayıtlı işlemler sonrası</div></div><div class="card"><div class="caption">Kredi kartı borcu</div><div class="value red">${fmt(c.debt)}</div><div class="sub">Ödemelerle güncellenir</div></div></div><div class="section-header"><h2>Bu ayki durum</h2>${monthBar()}</div><div class="panels"><div class="card"><div class="row"><h3 class="detail-title">Harcama limitleri</h3><span class="tag">Kontrol sende</span></div>${budget('🛒 Yaşam giderleri',c.spending,s.living)}${budget('🧰 Beklenmedik giderler',c.emergency,s.emergency)}${budget('📱 Telefon ve sabit',c.phone,s.phone)}</div><div class="card"><h3 class="detail-title">Maaş takvimi</h3><div class="budget-line row"><div><b>Ayın 1'i</b><div class="mini">Düzenli gelir</div></div><b class="value green" style="font-size:23px">${fmt(s.income1)}</b></div><div class="budget-line row"><div><b>Ayın 15'i</b><div class="mini">Düzenli gelir</div></div><b class="value green" style="font-size:23px">${fmt(s.income2)}</b></div><p class="form-hint">Maaşlar otomatik olarak banka bakiyene eklenmez. Para geldiğinde “Gelir ekle” ile kaydet; böylece yanlış bakiye oluşmaz.</p><button class="btn small primary" data-add="income">＋ Gelir ekle</button></div></div><div class="section-header"><h2>Son işlemler</h2><button class="btn small" data-page="transactions">Tümünü gör</button></div><div class="card">${transactions(c.monthTransactions.slice(0,6))}</div>`}
function transactionsPage(c){const filtered=filter==='all'?c.monthTransactions:c.monthTransactions.filter(x=>x.kind===filter);return `<div class="row" style="flex-wrap:wrap;margin-bottom:17px">${monthBar()}<div class="quick"><button class="btn small primary" data-add="living">＋ Gider ekle</button><button class="btn small" data-add="income">＋ Gelir ekle</button></div></div><div class="card"><div class="row" style="margin-bottom:15px"><b>Hareketler</b><select id="filterSelect" style="width:auto;max-width:170px"><option value="all" ${filter==='all'?'selected':''}>Tüm işlemler</option>${Object.entries(cats).map(([k,v])=>`<option value="${k}" ${filter===k?'selected':''}>${v.name}</option>`).join('')}</select></div>${transactions(filtered)}</div>`}
function budgetsPage(c){const s=state.settings;return `<div class="row" style="margin-bottom:18px">${monthBar()}<button class="btn small" data-page="settings">Limitleri değiştir</button></div><div class="cards"><div class="card hero"><div class="caption">Aylık toplam harcama limiti</div><div class="value">${fmt(s.living+s.emergency+s.phone)}</div><div class="sub">Gerçekleşen: ${fmt(c.spending+c.emergency+c.phone)}</div></div><div class="card"><div class="caption">Bu ay gelen gelir</div><div class="value green">${fmt(c.income)}</div><div class="sub">Kaydettiğin gelirler</div></div><div class="card"><div class="caption">Bu ay kredi kartı ödemesi</div><div class="value">${fmt(c.debtPaid)}</div><div class="sub">Bütçe harcaması sayılmaz</div></div></div><div class="section-header"><h2>Kategori bütçeleri</h2></div><div class="card">${budget('🛒 Yaşam giderleri',c.spending,s.living)}${budget('🧰 Beklenmedik giderler',c.emergency,s.emergency)}${budget('📱 Telefon',c.phone,s.phone)}</div><div class="section-header"><h2>Aylık plan</h2></div><div class="card"><div class="row budget-line"><span>Toplam planlı gelir</span><b>${fmt(s.income1+s.income2)}</b></div><div class="row budget-line"><span>Harcamalara ayrılan</span><b>${fmt(s.living+s.emergency+s.phone)}</b></div><div class="row budget-line"><strong>Birikim kapasitesi</strong><strong style="color:#8ce8b8">${fmt(s.income1+s.income2-s.living-s.emergency-s.phone)}</strong></div></div>`}
function assetsPage(c){return `<div class="cards"><div class="card hero"><div class="caption">TL nakit (banka)</div><div class="value">${fmt(c.bank)}</div><div class="sub">Başlangıç bakiyesi ve kayıtlı tüm işlemler</div></div><div class="card"><div class="caption">USD yatırım bakiyesi</div><div class="value green">${usd(c.dollars)}</div><div class="sub">${c.investmentValue===null?'TL değeri için kur girilebilir': 'Tahmini TL karşılığı: '+fmt(c.investmentValue)}</div></div><div class="card"><div class="caption">Kredi kartı borcu</div><div class="value red">${fmt(c.debt)}</div><div class="sub">Başlangıç borcu ve kayıtlı ödemeler</div></div></div><div class="section-header"><h2>Varlık hareketleri</h2></div><div class="card"><div class="quick"><button class="btn primary" data-add="debt">💳 Borç ödemesi</button><button class="btn" data-add="usdBuy">＋ USD alımı</button><button class="btn" data-add="usdSell">− USD satışı</button></div><p class="form-hint">USD yatırım alımında hesabından çıkan TL'yi ve aldığın USD tutarını gir. Yatırım hareketleri yaşam bütçesini azaltmaz; varlıklar arasında geçiş yapar.</p><div class="notice">Banka bakiyesi manuel başlangıç tutarından ilerler. Başka hesapların veya geçmişte gerçekleşmiş fakat kaydedilmemiş işlemlerin varsa Ayarlar'dan başlangıç tutarını düzenleyebilirsin.</div></div>`}
function chartData(){const labels=[],income=[],expenses=[];for(let i=5;i>=0;i--){const d=months();d.setMonth(d.getMonth()-i);const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');labels.push(new Intl.DateTimeFormat('tr-TR',{month:'short'}).format(d));const tx=state.transactions.filter(x=>x.date.startsWith(k));income.push(tx.filter(x=>x.kind==='income').reduce((a,x)=>a+x.amount,0));expenses.push(tx.filter(x=>['living','emergency','phone'].includes(x.kind)).reduce((a,x)=>a+x.amount,0))}return {labels,income,expenses}};
function settingsPage(){const s=state.settings,fields=[['income1','Ayın 1’indeki gelir'],['income2','Ayın 15’indeki gelir'],['living','Yaşam gideri limiti'],['emergency','Beklenmedik gider limiti'],['phone','Telefon / sabit gider limiti'],['bankOpening','Başlangıç banka bakiyesi'],['debtOpening','Başlangıç kart borcu'],['usdOpening','Başlangıç USD yatırımı'],['fx','USD/TL kuru (isteğe bağlı)']];const data=chartData(),max=Math.max(1,...data.income,...data.expenses);return `<div class="settings-list"><div class="card"><h3>Finansal ayarların</h3><form id="settingsForm" class="form-grid">${fields.map(([k,label])=>`<label class="field"><span>${label}</span><input name="${k}" type="number" min="0" step="0.01" required value="${s[k]}"></label>`).join('')}<div class="field full"><div class="notice">Başlangıç bakiyeleri, uygulamayı kullanmaya başladığın andaki değerlerdir. İşlem ekledikten sonra başlangıç tutarlarını değiştirmen mevcut bakiyeni de etkiler.</div></div><div class="field full"><button class="btn primary" type="submit">Değişiklikleri kaydet</button></div></form></div><div class="card"><h3>Son 6 ayın gelir / gider grafiği</h3><div class="bar-chart">${data.labels.map((_,i)=>`<div class="bar-group"><div class="bar" title="Gelir: ${fmt(data.income[i])}" style="height:${data.income[i]/max*100}%;background:#74deb5"></div><div class="bar" title="Gider: ${fmt(data.expenses[i])}" style="height:${data.expenses[i]/max*100}%;background:#f5b780"></div></div>`).join('')}</div><div class="chart-labels">${data.labels.map(x=>`<span>${x}</span>`).join('')}</div><div class="legend"><span><i class="dot" style="background:#74deb5"></i>Gelir</span><span><i class="dot" style="background:#f5b780"></i>Gider</span></div></div><div class="card"><h3>Yedekleme ve veri güvenliği</h3><p class="form-hint">Bilgiler yalnızca bu cihazdaki tarayıcıya kaydedilir. Otomatik bulut yedekleme ve cihazlar arası senkronizasyon yoktur. Tarayıcı verilerini temizlemeden veya cihaz değiştirmeden önce mutlaka yedek al.</p><div class="quick"><button class="btn primary" data-backup>↓ JSON yedek indir</button><label class="btn" style="cursor:pointer">↑ Yedek yükle<input id="restoreInput" type="file" accept=".json,application/json" hidden></label></div><p class="form-hint">Yedek yükleme mevcut verilerin yerine geçer. Güvenlik için yedek dosyalarını özel sakla.</p><button class="btn danger small" data-reset>Uygulama verilerini sıfırla</button></div><div class="card"><h3>Telefonuna yükleme</h3><p class="form-hint">Uygulamayı HTTPS üzerinden (örneğin ücretsiz GitHub Pages ile) yayınla. iPhone'da Safari'de açıp Paylaş → Ana Ekrana Ekle yolunu izle. Bilgisayarda Chrome veya Edge adres çubuğundaki “Yükle” seçeneğini kullanabilirsin.</p><p class="form-hint">Uygulamanın bu sürümünde giriş / şifre ve sunucu bulunmaz. Cihazına erişimi olan biri tarayıcı verilerine erişebilir.</p></div></div>`}
function render(){const c=calc();document.getElementById('navDesktop').innerHTML=nav();document.getElementById('navMobile').innerHTML=navM();document.getElementById('pageTitle').textContent=navs.find(x=>x[0]===page)[2];document.getElementById('view').innerHTML=({dashboard:dashboard,transactions:transactionsPage,budgets:budgetsPage,assets:assetsPage,settings:settingsPage})[page](c)}
const modalRoot=document.getElementById('modalRoot');function closeModal(){modalRoot.innerHTML=''}function modal(kind='living'){if(!cats[kind])kind='living';const isUsd=kind==='usdBuy'||kind==='usdSell';modalRoot.innerHTML=`<div class="modal-wrap" id="modalBackdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="row"><h2 id="modalTitle">Yeni işlem</h2><button class="delete" data-close aria-label="Kapat" style="font-size:23px">✕</button></div><form id="transactionForm"><label class="field"><span>İşlem türü</span><select name="kind" id="kindSelect">${Object.entries(cats).map(([k,v])=>`<option value="${k}" ${kind===k?'selected':''}>${v.emoji} ${v.name}</option>`).join('')}</select></label><div class="form-grid"><label class="field"><span>${isUsd?'TL tutarı':'Tutar (TL)'}</span><input name="amount" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="0,00" required autofocus></label><label class="field"><span>Tarih</span><input name="date" type="date" value="${today()}" required></label><label class="field full ${isUsd?'':'hidden'}" id="usdField"><span>USD miktarı</span><input name="usdAmount" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="Ör. 25"></label><label class="field full"><span>Açıklama (isteğe bağlı)</span><input name="note" maxlength="120" placeholder="Ör. Market alışverişi"></label></div><p class="form-hint">Gelir ve giderler yalnızca kaydettiğinde bakiyene işlenir. Borç ödemesi TL bakiyeni ve kart borcunu birlikte azaltır.</p><div class="modal-footer"><button type="button" class="btn" data-close>İptal</button><button type="submit" class="btn primary">İşlemi kaydet</button></div></form></div></div>`;document.querySelector('#kindSelect').addEventListener('change',e=>{document.getElementById('usdField').classList.toggle('hidden',!e.target.value.startsWith('usd'));document.querySelector('[name=usdAmount]').required=e.target.value.startsWith('usd')});document.querySelector('[name=usdAmount]').required=isUsd;}
function backup(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='finansim-yedek-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Yedek dosyası hazırlandı')}
function toast(msg){document.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}
function validateImport(data){if(!data||data.version!==1||!data.settings||!Array.isArray(data.transactions)||data.transactions.length>50000)return false;const keys=['income1','income2','living','emergency','phone','bankOpening','debtOpening','usdOpening','fx'];if(!keys.every(k=>typeof data.settings[k]==='number'&&Number.isFinite(data.settings[k])&&data.settings[k]>=0&&data.settings[k]<1e12))return false;return data.transactions.every(t=>typeof t.id==='string'&&typeof t.kind==='string'&&!!cats[t.kind]&&typeof t.date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(t.date)&&!Number.isNaN(new Date(t.date+'T12:00:00').getTime())&&typeof t.amount==='number'&&t.amount>0&&t.amount<1e12&&(!t.note||typeof t.note==='string'&&t.note.length<=120)&&(!t.kind.startsWith('usd')||typeof t.usdAmount==='number'&&t.usdAmount>0&&t.usdAmount<1e12))}
document.addEventListener('click',e=>{const t=e.target.closest('[data-page],[data-add],[data-month],[data-delete],[data-close],[data-backup],[data-reset]');if(!t){if(e.target.id==='modalBackdrop')closeModal();return}if(t.dataset.page){page=t.dataset.page;render();scrollTo(0,0)}else if(t.dataset.add)modal(t.dataset.add);else if(t.dataset.month)monthMove(+t.dataset.month);else if(t.dataset.close!==undefined)closeModal();else if(t.dataset.backup!==undefined)backup();else if(t.dataset.reset!==undefined){if(confirm('TÜM işlemler ve ayarlar silinecek. Önce yedek almanı öneririz. Devam edilsin mi?')){if(confirm('Emin misin? Bu işlem geri alınamaz.')){state=defaultState();save();page='dashboard';render();toast('Veriler sıfırlandı')}}}});
// Delete handler: use stable target id rather than a shadowed callback variable.
document.addEventListener('click',e=>{const t=e.target.closest('[data-delete]');if(!t)return;const txId=t.dataset.delete;if(!state.transactions.some(x=>x.id===txId))return; // handled in dedicated capture logic below
},true);
// Override deletion via delegated capture to ensure there is only one confirmation.
document.addEventListener('click',e=>{const t=e.target.closest('[data-delete]');if(!t)return;e.stopImmediatePropagation();const x=state.transactions.find(z=>z.id===t.dataset.delete);if(!x)return;if(confirm('“'+(x.note||cats[x.kind].name)+'” işlemini silmek istiyor musun?')){state.transactions=state.transactions.filter(z=>z.id!==x.id);save();render();toast('İşlem silindi')}},true);
document.addEventListener('change',async e=>{if(e.target.id==='filterSelect'){filter=e.target.value;render()}if(e.target.id==='restoreInput'){const file=e.target.files[0];if(!file)return;try{if(file.size>10*1024*1024)throw Error('Dosya çok büyük');const data=JSON.parse(await file.text());if(!validateImport(data))throw Error('Geçersiz yedek biçimi');if(confirm('Yedek dosyasını yüklemek mevcut tüm verilerin üzerine yazacak. Devam edilsin mi?')){state=data;save();render();toast('Yedek geri yüklendi')}}catch(err){alert('Yedek açılamadı: '+err.message)}}});document.addEventListener('submit',e=>{if(e.target.id==='transactionForm'){e.preventDefault();const f=new FormData(e.target),kind=f.get('kind'),amount=Number(f.get('amount')),usdAmount=Number(f.get('usdAmount'));if(!cats[kind]||!Number.isFinite(amount)||amount<=0||amount>=1e12)return alert('Geçerli bir tutar gir.');if(kind.startsWith('usd')&&(!Number.isFinite(usdAmount)||usdAmount<=0))return alert('USD tutarını gir.');const c=calc();if(kind==='debt'&&amount>c.debt)return alert('Ödeme mevcut kayıtlı borcu geçemez.');if(kind==='usdSell'&&usdAmount>c.dollars)return alert('Satılan USD miktarı mevcut yatırımını geçemez.');const entry={id:id(),kind,amount,date:String(f.get('date')),note:String(f.get('note')||'').trim().slice(0,120),created:new Date().toISOString()};if(kind.startsWith('usd'))entry.usdAmount=usdAmount;state.transactions.push(entry);save();closeModal();selectedMonth=entry.date.slice(0,7);render();toast('İşlem kaydedildi')}if(e.target.id==='settingsForm'){e.preventDefault();const f=new FormData(e.target);for(const k of Object.keys(state.settings)){const v=Number(f.get(k));if(!Number.isFinite(v)||v<0||v>=1e12)return alert('Geçerli, pozitif sayılar gir.');state.settings[k]=v}save();render();toast('Ayarlar kaydedildi')}});document.getElementById('addHeader').onclick=()=>modal('living');document.getElementById('backupHeader').onclick=backup;render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));})();
</script></body></html>
